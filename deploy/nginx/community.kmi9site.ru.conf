# Публичный фронт kmi9site.ru → Twenty на 127.0.0.1:3100.
# TLS-сертификат уже выпущен certbot (продлевается snap.certbot.renew.timer).

server {
    listen 80;
    listen [::]:80;
    server_name kmi9site.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://kmi9site.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kmi9site.ru;

    ssl_certificate     /etc/letsencrypt/live/kmi9site.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kmi9site.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Вложения CRM могут быть крупными
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
