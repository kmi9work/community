name: community

# Стек Twenty (prebuilt-образ) для kmi9site.ru.
# Порты наружу не публикуются: Twenty слушает только 127.0.0.1:HOST_PORT,
# фронт отдаёт nginx на этом же сервере (deploy/nginx/community.kmi9site.ru.conf).
# Лимиты памяти подобраны под VPS 2 ГБ RAM / 1 vCPU (см. deploy/README.md).

services:
  server:
    image: twentycrm/twenty:${TAG:-v2.58.0}
    stop_grace_period: 120s
    # На хосте 2 ГБ RAM живут ещё eraofchange, Hermes и telEgo: при нехватке
    # памяти ядро должно убивать Twenty, а не соседние сервисы.
    oom_score_adj: 500
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "127.0.0.1:${HOST_PORT:-3100}:3000"
    environment:
      NODE_PORT: 3000
      NODE_OPTIONS: --max-old-space-size=1024
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: always

  worker:
    image: twentycrm/twenty:${TAG:-v2.58.0}
    command: ["yarn", "worker:prod"]
    oom_score_adj: 500
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: redis://redis:6379
      DISABLE_DB_MIGRATIONS: "true" # миграции делает server
      DISABLE_CRON_JOBS_REGISTRATION: "true" # cron регистрирует server
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  server-local-data:
