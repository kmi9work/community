name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

# Деплои не должны выполняться параллельно: второй ждёт первого
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 45.133.210.22
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/community

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: system/backend/requirements*.txt
      - name: Тесты бэкенда (PostgreSQL)
        working-directory: system/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/test
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Миграции применяются на чистую базу
        working-directory: system/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/test
        run: |
          python - <<'PY'
          import sqlalchemy as sa
          e = sa.create_engine("postgresql+psycopg://postgres:test@127.0.0.1:5432/test")
          with e.begin() as c:
              c.execute(sa.text("drop schema public cascade; create schema public"))
          PY
          alembic upgrade head
          alembic check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: system/frontend/package-lock.json
      - name: Сборка админки
        working-directory: system/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Проверить наличие секрета DEPLOY_SSH_KEY
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::Секрет DEPLOY_SSH_KEY не задан (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Подготовить SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Деплой (git fetch + system/deploy/deploy.sh)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; cd $DEPLOY_PATH && git fetch --prune origin && git reset --hard origin/master && chmod +x system/deploy/deploy.sh && ./system/deploy/deploy.sh"
